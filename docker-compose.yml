name: tc-storefront

services:
  storefront:
    build: .
    image: ${STOREFRONT_IMAGE:-tc-storefront:local}
    container_name: tc-storefront
    restart: unless-stopped
    ports:
      - "${STOREFRONT_BIND:-0.0.0.0}:${STOREFRONT_HOST_PORT:-3001}:3000"
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "tcpos.local:host-gateway"
      - "dev.tcpos.local:host-gateway"
      - "demo1.tcpos.local:host-gateway"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(() => process.exit(0)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
