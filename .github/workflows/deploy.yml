name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          image="$(echo "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${GITHUB_SHA},${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          STOREFRONT_IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh_cmd=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          scp_cmd=(scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)

          "${ssh_cmd[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p /var/www/tc-storefront"

          "${scp_cmd[@]}" docker-compose.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/tc-storefront/docker-compose.yml"

          "${ssh_cmd[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
             docker login ghcr.io -u '${GHCR_USER}' --password-stdin
             cd /var/www/tc-storefront
             export STOREFRONT_IMAGE='${STOREFRONT_IMAGE}'
             export STOREFRONT_BIND=127.0.0.1
             export STOREFRONT_HOST_PORT=3001
             docker compose pull
             docker compose down --remove-orphans
             docker compose up -d --force-recreate --remove-orphans
             ok=0
             for i in \$(seq 1 30); do
               if curl -sS -I --max-time 2 http://127.0.0.1:3001/ >/dev/null 2>&1; then
                 ok=1
                 break
               fi
               sleep 2
             done
             if [ \"\$ok\" -ne 1 ]; then
               echo 'Storefront did not become reachable on 127.0.0.1:3001' >&2
               docker compose ps -a
               docker logs --tail 200 tc-storefront || true
               exit 1
             fi
             docker image prune -f
             docker logout ghcr.io" <<< "$GHCR_TOKEN"
